# libgarena CI（Linux + Windows）
#
# 范围：libgarena 静态库 + unittest。
# 依赖：libca 经 luiox-repo git 直连包拉取（xmake.lua 不声明 add_repositories，
# 由 CI/消费方显式注册，见 xmake.lua 头注释）；gtest 走 xrepo。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-linux:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          # cmake/ninja：xrepo 编译 gtest（cmake-based）需要。
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libgarena-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libgarena-xrepo-linux-x64-xmake309-

      - name: Register luiox-repo
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure (with tests)
        run: xmake f -p linux --with_tests=y -y

      - name: Build
        run: |
          xmake build libgarena
          xmake build libgarena_unittest

      - name: Run unit tests
        run: xmake run libgarena_unittest

  build-and-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: libgarena-xrepo-windows-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libgarena-xrepo-windows-x64-xmake309-

      - name: Register luiox-repo
        shell: bash
        run: xmake repo --add luiox-repo https://github.com/luiox/luiox-repo.git

      - name: Configure (with tests)
        shell: bash
        run: xmake f -p windows --with_tests=y -y

      - name: Build
        shell: bash
        run: |
          xmake build libgarena
          xmake build libgarena_unittest

      - name: Run unit tests
        shell: bash
        run: xmake run libgarena_unittest
